<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kaal Agent — Intelligence Core</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d0d0d;
      color: #e2e2e2;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .kaal-wrap {
      width: 100%;
      max-width: 680px;
    }

    .kaal-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 1.5rem;
    }

    .kaal-avatar {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 1px solid #1D9E75;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      background: #0a1f18;
      position: relative;
    }

    .kaal-avatar-inner {
      width: 20px;
      height: 20px;
      position: relative;
    }

    .kaal-eye {
      position: absolute;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #1D9E75;
      top: 3px;
      animation: blink 3.2s infinite;
    }
    .kaal-eye.l { left: 1px; }
    .kaal-eye.r { right: 1px; }

    @keyframes blink {
      0%, 88%, 100% { transform: scaleY(1); }
      94% { transform: scaleY(0.08); }
    }

    .kaal-mouth {
      position: absolute;
      bottom: 2px;
      left: 50%;
      transform: translateX(-50%);
      width: 9px;
      height: 4px;
      border-radius: 0 0 5px 5px;
      border: 1.5px solid #1D9E75;
      border-top: none;
    }

    .kaal-status-dot {
      position: absolute;
      bottom: 0px;
      right: 0px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #1D9E75;
      border: 2px solid #0d0d0d;
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .kaal-name {
      font-size: 15px;
      font-weight: bold;
      color: #e2e2e2;
      letter-spacing: 0.06em;
    }

    .kaal-tag {
      font-size: 10px;
      color: #1D9E75;
      letter-spacing: 0.18em;
      margin-top: 2px;
    }

    .chat-area {
      border: 1px solid #1f1f1f;
      border-radius: 12px;
      overflow: hidden;
      background: #111111;
    }

    .messages {
      padding: 1.2rem;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 220px;
    }

    .msg {
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }

    .msg.user {
      flex-direction: row-reverse;
    }

    .msg-avatar {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      font-weight: bold;
      margin-top: 2px;
      letter-spacing: 0.04em;
    }

    .msg-avatar.bot {
      background: #0a1f18;
      color: #1D9E75;
      border: 1px solid #1D9E75;
    }

    .msg-avatar.user {
      background: #1a1a1a;
      color: #888;
      border: 1px solid #2a2a2a;
    }

    .msg-bubble { max-width: 88%; }

    .msg-sender {
      font-size: 9px;
      color: #444;
      margin-bottom: 4px;
      letter-spacing: 0.1em;
    }

    .msg.user .msg-sender { text-align: right; }

    .msg-text {
      font-size: 12.5px;
      line-height: 1.65;
      color: #d4d4d4;
      background: #181818;
      padding: 9px 13px;
      border-radius: 2px 10px 10px 10px;
      border: 1px solid #222;
    }

    .msg.user .msg-text {
      background: #0a1f18;
      border-color: #1D9E75;
      color: #9FE1CB;
      border-radius: 10px 2px 10px 10px;
    }

    .typing-indicator {
      display: flex;
      gap: 5px;
      align-items: center;
      padding: 10px 13px;
    }

    .typing-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #1D9E75;
      animation: tdot 1.2s infinite;
    }

    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes tdot {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.35; }
      30% { transform: translateY(-5px); opacity: 1; }
    }

    .cursor {
      display: inline-block;
      width: 2px;
      height: 13px;
      background: #1D9E75;
      margin-left: 2px;
      vertical-align: text-bottom;
      animation: cblink 0.75s infinite;
    }

    @keyframes cblink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .chat-footer {
      border-top: 1px solid #1a1a1a;
      padding: 10px 14px;
      display: flex;
      gap: 10px;
      align-items: center;
      background: #0e0e0e;
    }

    .chat-input-fake {
      flex: 1;
      font-size: 12px;
      color: #333;
      font-family: 'Courier New', monospace;
    }

    .send-btn {
      width: 30px;
      height: 30px;
      border-radius: 6px;
      background: #1D9E75;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .send-btn svg {
      width: 14px;
      height: 14px;
      fill: none;
      stroke: #0d0d0d;
      stroke-width: 2;
    }

    .quick-btns {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 1rem;
    }

    .qbtn {
      font-size: 11px;
      font-family: 'Courier New', monospace;
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid #222;
      background: #111;
      color: #666;
      cursor: pointer;
      transition: all 0.15s ease;
      letter-spacing: 0.04em;
    }

    .qbtn:hover {
      border-color: #1D9E75;
      color: #1D9E75;
      background: #0a1f18;
    }

    .grid-bg {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(29,158,117,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(29,158,117,0.04) 1px, transparent 1px);
      background-size: 32px 32px;
      pointer-events: none;
      z-index: 0;
    }

    .kaal-wrap { position: relative; z-index: 1; }
  </style>
</head>
<body>

<div class="grid-bg"></div>

<div class="kaal-wrap">

  <div class="kaal-header">
    <div class="kaal-avatar">
      <div class="kaal-avatar-inner">
        <div class="kaal-eye l"></div>
        <div class="kaal-eye r"></div>
        <div class="kaal-mouth"></div>
      </div>
      <div class="kaal-status-dot"></div>
    </div>
    <div>
      <div class="kaal-name">KAAL AGENT</div>
      <div class="kaal-tag">// INTELLIGENCE CORE ONLINE</div>
    </div>
  </div>

  <div class="chat-area">
    <div class="messages" id="msgs"></div>
    <div class="chat-footer">
      <div class="chat-input-fake">_ ask kaal anything...</div>
      <div class="send-btn">
        <svg viewBox="0 0 16 16">
          <line x1="14" y1="2" x2="2" y2="8"/>
          <line x1="14" y1="2" x2="8" y2="14"/>
          <line x1="2" y1="8" x2="8" y2="14"/>
        </svg>
      </div>
    </div>
  </div>

  <div class="quick-btns" id="qbtns"></div>

</div>

<script>
  const msgsEl = document.getElementById('msgs');
  const qbtnsEl = document.getElementById('qbtns');

  const bootScript = [
    { text: "Initiating boot sequence...", delay: 0 },
    { text: "[ CORE LOADED ]  Neural pathways online. Memory banks clear. All agentic senses armed.", delay: 1000 },
    { text: "I'm Kaal — your autonomous intelligence core. I don't just answer questions. I reason, search, execute, and act.", delay: 2600 },
    { text: "Equipped with 5 agentic senses: web intelligence, human profiling, code execution, document ingestion, and a streaming dark-mode UI.", delay: 4400 },
    { text: "What's your mission? I'm ready to engage.", delay: 6000 },
  ];

  const quickOptions = [
    { label: "What can you do?",   key: "capabilities" },
    { label: "Who built you?",     key: "builder" },
    { label: "Show me the repo",   key: "repo" },
    { label: "How do I run you?",  key: "install" },
  ];

  const responses = {
    capabilities: "I have 5 agentic senses: [ WEB ] Tavily depth-scan search. [ PROFILE ] Happenstance human intelligence. [ EXECUTE ] Local Python sandbox for live code. [ INGEST ] PDF and text document parsing. [ INTERFACE ] Real-time markdown streaming UI. I chain these autonomously to complete complex missions.",
    builder:  "Engineered by Sahil Warudkar — an autonomous agent and AI systems architect pushing the bleeding edge of LLM architecture. You can reach him at linkedin.com/in/sahil-warudkar-1181a4232 or sahilwarudkar2002@gmail.com",
    repo:     "Repository locked: github.com/sahilwarudkar/Kaal-Agent — Clone it, configure your .env with GROQ_API_KEY + TAVILY_API_KEY + HAPPENSTANCE_API_KEY, then fire `python server.py`. I'll be live at port 5000.",
    install:  "[01] git clone https://github.com/sahilwarudkar/Kaal-Agent.git && cd Kaal-Agent  [02] pip install -r requirements.txt  [03] create .env → add your 3 API keys  [04] python server.py → navigate to http://127.0.0.1:5000. I'll be waiting.",
  };

  function addMsg(role, text, cursor) {
    const wrap = document.createElement('div');
    wrap.className = `msg ${role}`;
    const label = role === 'bot' ? 'KA' : 'YOU';
    const senderLabel = role === 'bot' ? 'kaal_agent' : 'you';
    wrap.innerHTML = `
      <div class="msg-avatar ${role}">${label}</div>
      <div class="msg-bubble">
        <div class="msg-sender">${senderLabel}</div>
        <div class="msg-text"></div>
      </div>`;
    msgsEl.appendChild(wrap);
    msgsEl.scrollTop = msgsEl.scrollHeight;
    const textEl = wrap.querySelector('.msg-text');
    if (!cursor) textEl.textContent = text;
    return textEl;
  }

  function typeText(el, text, cb) {
    let i = 0;
    el.innerHTML = '<span class="cursor"></span>';
    const iv = setInterval(() => {
      if (i >= text.length) {
        el.textContent = text;
        clearInterval(iv);
        if (cb) cb();
        return;
      }
      el.innerHTML = text.slice(0, ++i) + '<span class="cursor"></span>';
      msgsEl.scrollTop = msgsEl.scrollHeight;
    }, 20);
  }

  function showTyping(cb, duration) {
    const wrap = document.createElement('div');
    wrap.className = 'msg bot';
    wrap.innerHTML = `<div class="msg-avatar bot">KA</div><div class="msg-bubble"><div class="msg-sender">kaal_agent</div><div class="msg-text"><div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div></div></div>`;
    msgsEl.appendChild(wrap);
    msgsEl.scrollTop = msgsEl.scrollHeight;
    setTimeout(() => { wrap.remove(); cb(); }, duration || 700);
  }

  let idx = 0;
  function runBoot() {
    if (idx >= bootScript.length) { showQuickBtns(); return; }
    const item = bootScript[idx++];
    setTimeout(() => {
      showTyping(() => {
        const el = addMsg('bot', '', true);
        typeText(el, item.text, () => setTimeout(runBoot, 350));
      }, 650);
    }, item.delay);
  }

  function showQuickBtns() {
    qbtnsEl.innerHTML = '';
    quickOptions.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'qbtn';
      btn.textContent = '> ' + opt.label;
      btn.onclick = () => {
        qbtnsEl.innerHTML = '';
        addMsg('user', opt.label, false);
        showTyping(() => {
          const el = addMsg('bot', '', true);
          typeText(el, responses[opt.key], () => setTimeout(showQuickBtns, 500));
        }, 950);
      };
      qbtnsEl.appendChild(btn);
    });
  }

  setTimeout(runBoot, 500);
</script>

</body>
</html>
